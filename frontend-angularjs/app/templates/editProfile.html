<div class="main-content">
  <div ng-if="vm.loading" class="text-center">
    <md-progress-circular md-mode="indeterminate"></md-progress-circular>
  </div>

  <div ng-if="!vm.loading">
    <md-card class="dashboard-card">
      <h2>Edit Profile</h2>

      <p class="error-message" ng-if="vm.error">{{vm.error}}</p>

      <form ng-submit="vm.save()">
        <md-input-container class="full-width">
          <label>Full Name</label>
          <input type="text" ng-model="vm.user.name" required>
          <div class="field-error" ng-if="vm.errors.name">{{vm.errors.name}}</div>
        </md-input-container>

        <md-input-container class="full-width">
          <label>Email</label>
          <input type="email" ng-model="vm.user.email" required>
          <div class="field-error" ng-if="vm.errors.email">{{vm.errors.email}}</div>
        </md-input-container>

        <md-input-container class="full-width">
          <label>Phone</label>
          <input type="text" ng-model="vm.user.phone" required>
          <div class="field-error" ng-if="vm.errors.phone">{{vm.errors.phone}}</div>
        </md-input-container>

        <div layout="row" layout-align="start center">
          <md-button type="submit" class="md-raised md-primary" ng-disabled="vm.saving">
            {{vm.saving ? 'Saving...' : 'Save Changes'}}
          </md-button>
          <md-button class="md-raised" ng-click="vm.cancel()">Cancel</md-button>
        </div>
      </form>
    </md-card>
  </div>
</div>
