<div class="main-content">
  <md-card class="dashboard-card">
    <h2>Change Password</h2>

    <p class="error-message" ng-if="vm.error">{{vm.error}}</p>
    <p class="success-message" ng-if="vm.success">{{vm.success}}</p>

    <form ng-submit="vm.changePassword()">
      <md-input-container class="full-width">
        <label>Current Password</label>
        <input type="password" ng-model="vm.data.oldPassword" required>
        <div class="field-error" ng-if="vm.errors.oldPassword">{{vm.errors.oldPassword}}</div>
      </md-input-container>

      <md-input-container class="full-width">
        <label>New Password</label>
        <input type="password" ng-model="vm.data.newPassword" required>
        <div class="field-error" ng-if="vm.errors.newPassword">{{vm.errors.newPassword}}</div>
      </md-input-container>

      <div layout="row" layout-align="start center">
        <md-button type="submit" class="md-raised md-primary" ng-disabled="vm.loading">
          {{vm.loading ? 'Changing...' : 'Change Password'}}
        </md-button>
        <md-button class="md-raised" ng-click="vm.goBack()">Back to Profile</md-button>
      </div>
    </form>
  </md-card>
</div>
