<!DOCTYPE html>
<html lang="en" ng-app="userManagementApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Microservices User Management System">
  <title>User Management System</title>

  <!-- Angular Material CSS -->
  <link rel="stylesheet" href="node_modules/angular-material/angular-material.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles/main.css">
  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body ng-cloak>

  <!-- Top Navbar -->
  <div ng-controller="NavController">
    <md-toolbar ng-if="isLoggedIn()">
      <div class="md-toolbar-tools">
        <h2>User Management</h2>
        <span flex></span>
        <md-button ui-sref="dashboard">Dashboard</md-button>
        <md-button ui-sref="profile">Profile</md-button>
        <md-button ng-click="logout()">Logout</md-button>
      </div>
    </md-toolbar>
  </div>

  <!-- Main Content -->
  <div ui-view class="main-content"></div>

  <!-- AngularJS -->
  <script src="node_modules/angular/angular.min.js"></script>
  <script src="node_modules/angular-animate/angular-animate.min.js"></script>
  <script src="node_modules/angular-aria/angular-aria.min.js"></script>
  <script src="node_modules/angular-messages/angular-messages.min.js"></script>
  <script src="node_modules/angular-material/angular-material.min.js"></script>
  <script src="node_modules/angular-ui-router/release/angular-ui-router.min.js"></script>

  <!-- App -->
  <script src="app/app.js"></script>

  <!-- Services -->
  <script src="app/services/auth.service.js"></script>
  <script src="app/services/user.service.js"></script>

  <!-- Guards -->
  <script src="app/guards/auth.guard.js"></script>

  <!-- Controllers -->
  <script src="app/controllers/nav.controller.js"></script>
  <script src="app/controllers/login.controller.js"></script>
  <script src="app/controllers/register.controller.js"></script>
  <script src="app/controllers/dashboard.controller.js"></script>
  <script src="app/controllers/profile.controller.js"></script>
  <script src="app/controllers/editProfile.controller.js"></script>
  <script src="app/controllers/changePassword.controller.js"></script>

  <!-- Routes -->
  <script src="app/routes/routes.js"></script>
</body>
</html>
