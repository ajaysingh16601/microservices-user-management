version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env.dev
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./user-service/.env.dev
    depends_on:
      - auth-service
    volumes:
      - user-uploads:/app/uploads
    restart: unless-stopped

volumes:
  user-uploads:
